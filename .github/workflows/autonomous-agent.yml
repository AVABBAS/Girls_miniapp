name: Autonomous Atria Development

on:
  workflow_dispatch:
    inputs:
      max_hours:
        description: "Maximum autonomous runtime (hours)"
        required: false
        default: "10"
      max_tokens:
        description: "Target maximum Atria token budget"
        required: false
        default: "100000000"
      dry_run:
        description: "Run in read-only mode"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: girls-miniapp-autonomous
  cancel-in-progress: false

jobs:
  autonomous-development:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    env:
      MAX_HOURS: ${{ github.event.inputs.max_hours || '10' }}
      MAX_TOKENS: ${{ github.event.inputs.max_tokens || '100000000' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Create dedicated Codex user
        run: |
          set -euo pipefail
          if ! id guest >/dev/null 2>&1; then
            sudo adduser --system --home /home/guest --shell /bin/bash --group guest
          fi
          sudo usermod -a -G guest runner
          sudo usermod -a -G runner guest

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify autonomous contract
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f docs/ROADMAP.md
          test -f docs/DEFINITION_OF_DONE.md
          test -f docs/AGENT_PROGRESS.md
          test -f docs/AUTONOMOUS_PROMPT.md

      - name: Configure git
        run: |
          git config user.name "Girls Mini App Autonomous Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Dry-run inspection
        if: env.DRY_RUN == 'true'
        run: |
          echo "Dry run enabled."
          git status --short
          sed -n '1,220p' AGENTS.md
          sed -n '1,260p' docs/ROADMAP.md

      - name: Prepare Codex workspace and Atria model catalog
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          CODEX_HOME="/home/guest/.codex"
          sudo mkdir -p "$CODEX_HOME"
          sudo tee "$CODEX_HOME/atria-catalog.json" >/dev/null <<'EOF'
          {
            "models": [
              {
                "slug": "Atria-Dawn-Preview",
                "display_name": "Atria-Dawn-Preview",
                "base_instructions": "You are a coding agent running in the Codex CLI. You collaborate with the user in a shared workspace to accomplish their software engineering goals. You can only receive text input. Images, screenshots, PDFs, and other binary attachments are not available to you. If the user refers to an attachment you cannot see, say so plainly and ask them to paste the relevant text instead.",
                "supported_reasoning_levels": [
                  {"effort": "low", "description": "Fast responses with lighter reasoning"},
                  {"effort": "medium", "description": "Balances speed and reasoning depth"},
                  {"effort": "high", "description": "Greater reasoning depth for complex problems"}
                ],
                "shell_type": "unified_exec",
                "visibility": "list",
                "supported_in_api": true,
                "priority": 1,
                "support_verbosity": false,
                "truncation_policy": {"mode": "tokens", "limit": 10000},
                "experimental_supported_tools": [],
                "context_window": 256000,
                "max_context_window": 256000,
                "input_modalities": ["text"]
              }
            ]
          }
          EOF
          sudo tee "$CODEX_HOME/config.toml" >/dev/null <<'EOF'
          model = "Atria-Dawn-Preview"
          model_provider = "atria"
          model_catalog_json = "/home/guest/.codex/atria-catalog.json"
          approval_policy = "never"
          sandbox_mode = "workspace-write"

          [sandbox_workspace_write]
          network_access = true

          [model_providers.atria]
          name = "Atria"
          base_url = "https://api.atria-asi.ai/v1"
          env_key = "ATRIA_API_KEY"
          wire_api = "responses"
          EOF
          sudo chown -R guest:guest "$CODEX_HOME"
          sudo chown -R runner:guest "$GITHUB_WORKSPACE"
          sudo chmod -R g+rwX "$GITHUB_WORKSPACE"
          sudo find "$GITHUB_WORKSPACE" -type d -exec chmod g+s {} +

      - name: Run Atria autonomous agent
        if: env.DRY_RUN != 'true'
        uses: openai/codex-action@main
        with:
          openai-api-key: ${{ secrets.ATRIA_API_KEY }}
          responses-api-endpoint: https://api.atria-asi.ai/v1/responses
          model: Atria-Dawn-Preview
          effort: high
          sandbox: workspace-write
          safety-strategy: unprivileged-user
          codex-user: guest
          working-directory: ${{ github.workspace }}
          prompt-file: docs/AUTONOMOUS_PROMPT.md
          output-file: .agent-last-message.txt
          codex-args: '--ephemeral'

      - name: Restore runner write access
        if: always()
        run: |
          set -euo pipefail
          sudo chown -R runner:guest "$GITHUB_WORKSPACE"
          sudo chmod -R g+rwX "$GITHUB_WORKSPACE"

      - name: Save agent summary
        if: always() && env.DRY_RUN != 'true'
        run: |
          if [ -f .agent-last-message.txt ]; then
            {
              echo "## Last autonomous agent report"
              echo
              cat .agent-last-message.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f .agent-last-message.txt

      - name: Security scan for obvious leaked credentials
        if: always()
        run: |
          set -euo pipefail
          if git grep -nE '(sk-[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|atr_[A-Za-z0-9_-]{20,})' -- ':!docs/AUTONOMOUS_PROMPT.md'; then
            echo "Potential credential detected in tracked files."
            exit 1
          fi

      - name: Commit and push verified changes
        if: env.DRY_RUN != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: autonomous development progress"
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main

      - name: Final status
        if: always()
        run: |
          git status --short
          git log -8 --oneline
