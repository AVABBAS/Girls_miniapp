name: Autonomous Atria Development

on:
  workflow_dispatch:
    inputs:
      max_hours:
        description: "Maximum autonomous runtime (hours)"
        required: false
        default: "10"
      max_tokens:
        description: "Target maximum Atria token budget"
        required: false
        default: "100000000"
      dry_run:
        description: "Run in read-only mode"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: girls-miniapp-autonomous
  cancel-in-progress: false

jobs:
  autonomous-development:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    env:
      MAX_HOURS: ${{ github.event.inputs.max_hours || '10' }}
      MAX_TOKENS: ${{ github.event.inputs.max_tokens || '100000000' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify autonomous contract
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f docs/ROADMAP.md
          test -f docs/DEFINITION_OF_DONE.md
          test -f docs/AGENT_PROGRESS.md
          test -f docs/AUTONOMOUS_PROMPT.md

      - name: Configure git
        run: |
          git config user.name "Girls Mini App Autonomous Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Dry-run inspection
        if: env.DRY_RUN == 'true'
        run: |
          echo "Dry run enabled."
          git status --short
          sed -n '1,220p' AGENTS.md
          sed -n '1,260p' docs/ROADMAP.md

      - name: Prepare ephemeral Atria Codex home
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          CODEX_CI_HOME="/home/runner/.codex-atria"
          mkdir -p "$CODEX_CI_HOME"
          cat > "$CODEX_CI_HOME/atria-catalog.json" <<'EOF'
          {
            "models": [
              {
                "slug": "Atria-Dawn-Preview",
                "display_name": "Atria-Dawn-Preview",
                "base_instructions": "You are a coding agent running in the Codex CLI. You collaborate with the user in a shared workspace to accomplish their software engineering goals. You can only receive text input. Images, screenshots, PDFs, and other binary attachments are not available to you.",
                "supported_reasoning_levels": [
                  {"effort": "low", "description": "Fast responses with lighter reasoning"},
                  {"effort": "medium", "description": "Balances speed and reasoning depth"},
                  {"effort": "high", "description": "Greater reasoning depth for complex problems"}
                ],
                "shell_type": "unified_exec",
                "visibility": "list",
                "supported_in_api": true,
                "priority": 1,
                "support_verbosity": false,
                "truncation_policy": {"mode": "tokens", "limit": 10000},
                "experimental_supported_tools": [],
                "context_window": 256000,
                "max_context_window": 256000,
                "input_modalities": ["text"]
              }
            ]
          }
          EOF
          cat > "$CODEX_CI_HOME/config.toml" <<EOF
          model = "Atria-Dawn-Preview"
          model_provider = "atria"
          model_catalog_json = "$CODEX_CI_HOME/atria-catalog.json"
          approval_policy = "never"
          sandbox_mode = "workspace-write"

          [sandbox_workspace_write]
          network_access = true

          [model_providers.atria]
          name = "Atria"
          base_url = "https://api.atria-asi.ai/v1"
          env_key = "ATRIA_API_KEY"
          wire_api = "responses"
          EOF

      - name: Prepare unprivileged Codex workspace
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          # Codex runs as the unprivileged nobody account so the API key is not
          # exposed to a privileged process. Give that account ownership of the
          # checked-out workspace and its ephemeral Codex home.
          sudo chown -R nobody:nogroup "$GITHUB_WORKSPACE" /home/runner/.codex-atria

      - name: Run Atria autonomous agent
        if: env.DRY_RUN != 'true'
        uses: openai/codex-action@main
        with:
          openai-api-key: ${{ secrets.ATRIA_API_KEY }}
          responses-api-endpoint: https://api.atria-asi.ai/v1/responses
          model: Atria-Dawn-Preview
          effort: high
          sandbox: workspace-write
          safety-strategy: unprivileged-user
          codex-user: nobody
          codex-home: /home/runner/.codex-atria
          working-directory: ${{ github.workspace }}
          prompt-file: docs/AUTONOMOUS_PROMPT.md
          output-file: .agent-last-message.txt
          codex-args: '--ephemeral'

      - name: Save agent summary
        if: always() && env.DRY_RUN != 'true'
        run: |
          if [ -f .agent-last-message.txt ]; then
            {
              echo "## Last autonomous agent report"
              echo
              cat .agent-last-message.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f .agent-last-message.txt

      - name: Security scan for obvious leaked credentials
        if: always()
        run: |
          set -euo pipefail
          if git grep -nE '(sk-[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|atr_[A-Za-z0-9_-]{20,})' -- ':!docs/AUTONOMOUS_PROMPT.md'; then
            echo "Potential credential detected in tracked files."
            exit 1
          fi

      - name: Commit and push verified changes
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: autonomous development progress"
          git push origin HEAD:main

      - name: Final status
        if: always()
        run: |
          git status --short
          git log -8 --oneline
